<style>
:root{
  color-scheme: dark;
  --accent:#c4c4cd;
  --bg:#0a0a0b;
  --surface:#161618;
  --surface-2:#1d1d20;
  --line:#2a2a2e;
  --text:#f4f4f5;
  --muted:#9a9aa2;
  --muted-2:#6c6c74;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--bg);font-family:'Inter',system-ui,sans-serif;color:var(--text)}
body{min-height:100vh;overflow-x:hidden;position:relative}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.nebula{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:48px 24px 72px}

header{display:flex;flex-direction:column;align-items:center;text-align:center}
#logo{height:96px;width:auto;filter:drop-shadow(0 6px 26px rgba(0,0,0,.7))}
.eyebrow{margin-top:18px;font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:6px 16px;border-radius:999px}
h1{margin-top:20px;font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(34px,6vw,64px);letter-spacing:1px;line-height:1.02;text-transform:uppercase}
h1 .num{display:inline-block;min-width:1.1ch;color:var(--accent)}
.sub{margin-top:12px;font-size:15px;color:var(--muted);max-width:560px;line-height:1.5}

.layout{margin-top:36px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
.map-card{position:relative;background:linear-gradient(180deg,rgba(29,29,32,.55),rgba(14,14,16,.55));border:1px solid var(--line);border-radius:22px;overflow:hidden;backdrop-filter:blur(4px)}
svg#map{display:block;width:100%;height:auto}

/* Mapa */
.neigh{fill:#0f0f11;stroke:#1f1f23;stroke-width:.8}
.region{fill:#141417;stroke:#4a4a52;stroke-width:1;stroke-linejoin:round;
  stroke-dasharray:1;stroke-dashoffset:1;fill-opacity:0;
  animation:draw 1.6s cubic-bezier(.6,.1,.3,1) forwards, fillIn .9s ease forwards;transition:fill .3s}
.region:hover{fill:#1b1b1f}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillIn{to{fill-opacity:1}}
.inset{fill:rgba(255,255,255,.015);stroke:#3a3a40;stroke-dasharray:5 6;stroke-width:1;opacity:0;animation:fade .6s ease 1.2s forwards}
.inset-label{fill:var(--muted-2);font-size:calc(11px * var(--k,1));font-weight:700;letter-spacing:2px;opacity:0;animation:fade .6s ease 1.4s forwards}
@keyframes fade{to{opacity:1}}

/* Líneas desde Larry */
.arc{fill:none;stroke:rgba(196,196,205,.28);stroke-width:1.2;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke .25s,stroke-width .25s,opacity .25s}
.arc.go{animation:draw 1.1s cubic-bezier(.5,0,.2,1) forwards}
.flow{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-dasharray:.035 .965;stroke-dashoffset:1;opacity:0;filter:url(#glow)}
.flow.go{opacity:.75;animation:flow 3.2s linear infinite}
@keyframes flow{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

/* Puntos */
.st{cursor:pointer;opacity:0;transition:opacity .3s}
.st.go{animation:pop .55s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:scale(1)}}
.st{transform-box:fill-box;transform-origin:center}
.st .core{fill:#fff;filter:url(#glow)}
.st .ring{fill:none;stroke:#fff;stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:ring 2.6s ease-out infinite}
.st .ring.r2{animation-delay:1.3s}
@keyframes ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(3.2);opacity:0}}
.st .hit{fill:transparent}
.st text{font-size:calc(12.5px * var(--k,1));font-weight:800;letter-spacing:1.2px;text-transform:uppercase;fill:#e6e6ea;paint-order:stroke;stroke:#0a0a0b;stroke-width:calc(4px * var(--k,1));stroke-linejoin:round;pointer-events:none}
.st text.who{font-size:calc(10.5px * var(--k,1));font-weight:600;letter-spacing:.4px;text-transform:none;fill:var(--muted)}
.zone{fill:none;stroke:rgba(196,196,205,.55);stroke-width:1.2;stroke-dasharray:2 3;opacity:.0;transition:opacity .3s}
.zone-dot{fill:#0a0a0b;stroke:var(--accent);stroke-width:1.4;opacity:.45;transition:opacity .3s}
.zone-label{font-size:calc(10px * var(--k,1));font-weight:700;letter-spacing:1px;text-transform:uppercase;fill:var(--muted);paint-order:stroke;stroke:#0a0a0b;stroke-width:3px;opacity:0;transition:opacity .3s}

/* Larry */
.home{opacity:0;animation:fade .6s ease .9s forwards}
.home .sq{fill:#fff;filter:url(#glow);transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.home .halo{fill:url(#halo)}
.home text{font-family:'Anton',sans-serif;font-size:calc(17px * var(--k,1));letter-spacing:2px;fill:#fff;paint-order:stroke;stroke:#0a0a0b;stroke-width:4px}
.home text.small{font-family:'Inter',sans-serif;font-size:calc(10px * var(--k,1));font-weight:700;letter-spacing:2px;fill:var(--muted)}

/* Estado activo */
svg.has-active .st:not(.active){opacity:.28 !important}
svg.has-active .arc:not(.active){opacity:.25}
svg.has-active .flow:not(.active){opacity:.08}
.arc.active{stroke:#fff;stroke-width:2}
.flow.active{opacity:1;stroke-width:3}
.st.active .core{fill:#fff}
svg.yisus .zone{opacity:1} svg.yisus .zone-dot{opacity:1} svg.yisus .zone-label{opacity:1}

/* Ficha */
.tip{position:absolute;z-index:3;width:250px;padding:16px 16px 14px;background:rgba(22,22,24,.94);border:1px solid #3a3a40;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.6);
  pointer-events:none;opacity:0;transform:translate(-50%,calc(-100% - 22px)) scale(.96);transition:opacity .18s,transform .18s}
.tip.show{opacity:1;pointer-events:auto;transform:translate(-50%,calc(-100% - 22px)) scale(1)}
.tip.below{transform:translate(-50%,22px) scale(.96)} .tip.below.show{transform:translate(-50%,22px) scale(1)}
.tip .k{font-size:10.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted-2)}
.tip h3{margin-top:4px;font-size:19px;font-weight:800}
.tip .loc{margin-top:2px;font-size:12.5px;color:var(--muted)}
.tip .price{margin-top:12px;display:flex;align-items:baseline;gap:8px}
.tip .price b{font-family:'Anton',sans-serif;font-weight:400;font-size:28px;letter-spacing:.5px}
.tip .price s{color:var(--muted-2);font-size:13px}
.tip a{margin-top:12px;display:block;text-align:center;font-size:13px;font-weight:700;color:var(--bg);background:var(--accent);border-radius:999px;padding:9px 12px;text-decoration:none}
.tip a:hover{background:#fff}

/* Lista */
.list{background:rgba(22,22,24,.7);border:1px solid var(--line);border-radius:22px;padding:18px;backdrop-filter:blur(4px)}
.list h2{font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--muted);padding:2px 6px 12px}
.item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;border:1px solid transparent;cursor:pointer;text-decoration:none;color:inherit;
  opacity:0;transform:translateX(14px);transition:background .2s,border-color .2s}
.item.go{animation:slideIn .45s ease forwards}
@keyframes slideIn{to{opacity:1;transform:none}}
.item:hover,.item.active{background:var(--surface-2);border-color:var(--line)}
.item .dot{width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.7);flex:none}
.item .t{flex:1;min-width:0}
.item .n{font-size:14px;font-weight:700}
.item .c{font-size:12px;color:var(--muted);margin-top:1px}
.item .p{font-size:13px;font-weight:800;color:var(--accent)}
.legend{margin-top:14px;padding:12px 8px 2px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.6}
.legend span{display:inline-flex;align-items:center;gap:8px;margin-right:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%}
.back{display:inline-block;margin-top:28px;font-size:13px;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line)}
.back:hover{color:var(--text)}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .wrap{padding:32px 16px 56px}
  #logo{height:72px}
  .tip{width:220px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition:none !important}
}
</style>

// En pantallas chicas el texto y los puntos crecen para seguir leyéndose
const K = Math.max(1, Math.min(2.6, 760 / (svg.clientWidth || 760)));
const SMALL = K > 1.7;
svg.style.setProperty('--k', K);
const el = (tag, attrs = {}, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

// Filtros y gradientes
const defs = el('defs');
defs.innerHTML = `
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="halo"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>`;

// Países vecinos y regiones
const gN = el('g');
D.neigh.forEach(d => el('path', { d, class: 'neigh' }, gN));
const gR = el('g');
D.regions.forEach((r, i) => {
  const p = el('path', { d: r.d, class: 'region', pathLength: 1 }, gR);
  p.style.animationDelay = `${i * 45}ms, ${700 + i * 45}ms`;
  el('title', {}, p).textContent = r.n;
});
// Recuadro Canarias
const b = D.box;
el('rect', { x: b.x, y: b.y, width: b.w, height: b.h, rx: 14, class: 'inset' }).parentNode.insertBefore(svg.lastChild, gR);
el('text', { x: b.x + 14, y: b.y - 8, class: 'inset-label' }).textContent = 'ISLAS CANARIAS';

// Arcos desde Larry
const gA = el('g'), gF = el('g'), gZ = el('g'), gS = el('g');
const H = D.home;
function arcPath(x, y) {
  const mx = (H.x + x) / 2, my = (H.y + y) / 2;
  const dx = x - H.x, dy = y - H.y, len = Math.hypot(dx, dy) || 1;
  const bend = Math.min(160, len * .28);
  return `M${H.x},${H.y} Q${mx - dy / len * bend},${my + dx / len * bend - bend * .35} ${x},${y}`;
}

// Etiquetas: lado por estudio para que no se pisen
const side = SMALL
  ? { jotage: 'left', cray: 'left', javichu: 'left', charly: 'below', fede: 'below', danilo: 'left' }
  : { jotage: 'left', cray: 'left', javichu: 'left', charly: 'below', fede: 'left', danilo: 'right' };

const yisus = D.studios.find(s => s.zones);
if (yisus) yisus.zones.forEach(z => {
  el('path', { d: `M${yisus.x},${yisus.y} L${z.x},${z.y}`, class: 'zone' }, gZ);
  el('circle', { cx: z.x, cy: z.y, r: 5, class: 'zone-dot' }, gZ);
  el('text', { x: z.x + 9 * K, y: z.y + 14 * K, class: 'zone-label' }, gZ).textContent = z.n;
});

const nodes = {};
D.studios.forEach(s => {
  const d = arcPath(s.x, s.y);
  const arc = el('path', { d, class: 'arc', pathLength: 1 }, gA);
  const flow = el('path', { d, class: 'flow', pathLength: 1 }, gF);
  flow.style.animationDelay = `${Math.random() * -3.2}s`;
  const g = el('g', { class: 'st', tabindex: 0, role: 'button', 'aria-label': `${s.name}, ${s.city}` }, gS);
  const dr = Math.sqrt(K);
  el('circle', { cx: s.x, cy: s.y, r: 6 * dr, class: 'ring' }, g);
  el('circle', { cx: s.x, cy: s.y, r: 6 * dr, class: 'ring r2' }, g);
  el('circle', { cx: s.x, cy: s.y, r: 5.5 * dr, class: 'core' }, g);
  el('circle', { cx: s.x, cy: s.y, r: 22 * K, class: 'hit' }, g);
  const sd = side[s.id] || 'right';
  let tx = s.x + 13 * K, ty = s.y + 4 * K, anchor = 'start';
  if (sd === 'left') { tx = s.x - 13 * K; anchor = 'end'; }
  if (sd === 'below') { tx = s.x; ty = s.y + 26 * K; anchor = 'middle'; }
  el('text', { x: tx, y: ty, 'text-anchor': anchor }, g).textContent = SMALL ? s.city.replace('Islas ', '') : s.city;
  if (!SMALL) el('text', { x: tx, y: ty + 14 * K, 'text-anchor': anchor, class: 'who' }, g).textContent = s.name;
  nodes[s.id] = { s, g, arc, flow };
  g.addEventListener('mouseenter', () => activate(s.id));
  g.addEventListener('mouseleave', () => scheduleClear());
  g.addEventListener('click', e => { e.stopPropagation(); activate(s.id, true); });
  g.addEventListener('focus', () => activate(s.id));
  g.addEventListener('keydown', e => { if (e.key === 'Enter') location.href = encodeURI(s.pack); });
});

// Larry en Mallorca
const gH = el('g', { class: 'home' });
el('circle', { cx: H.x, cy: H.y, r: 46, class: 'halo' }, gH);
el('rect', { x: H.x - 7, y: H.y - 7, width: 14, height: 14, rx: 2, class: 'sq' }, gH);
el('text', { x: H.x, y: H.y - 22 * K, 'text-anchor': 'middle' }, gH).textContent = 'LARRY';
if (!SMALL) el('text', { x: H.x, y: H.y + 30, 'text-anchor': 'middle', class: 'small' }, gH).textContent = 'MALLORCA · ONLINE';

// Lista
const items = document.getElementById('items');
D.studios.slice().sort((a, b) => a.city.localeCompare(b.city, 'es')).forEach((s, i) => {
  const a = document.createElement('a');
  a.className = 'item'; a.href = encodeURI(s.pack);
  a.innerHTML = `<span class="dot"></span><span class="t"><div class="n">${s.city}</div><div class="c">${s.name}</div></span><span class="p">${s.price}€</span>`;
  a.addEventListener('mouseenter', () => activate(s.id));
  a.addEventListener('mouseleave', () => scheduleClear());
  a.style.animationDelay = `${1.8 + i * .06}s`;
  items.appendChild(a); nodes[s.id].item = a;
  requestAnimationFrame(() => a.classList.add('go'));
});

// Activar estudio
let current = null, clearT = null;
function activate(id) {
  clearTimeout(clearT);
  if (current && current !== id) deactivate(current);
  current = id;
  const n = nodes[id], s = n.s;
  svg.classList.add('has-active'); svg.classList.toggle('yisus', !!s.zones);
  [n.g, n.arc, n.flow, n.item].forEach(e => e && e.classList.add('active'));
  const strike = s.price === 425 ? 745 : 700;
  tip.innerHTML = `<div class="k">Estudio socio · ${s.city}</div><h3>${s.name}</h3><div class="loc">${s.sub}</div>
    <div class="price"><b>${s.price}€</b><s>${strike}€</s></div><a href="${encodeURI(s.pack)}">Ver pack →</a>`;
  const rect = svg.getBoundingClientRect(), k = rect.width / D.W;
  let left = s.x * k, top = s.y * k;
  left = Math.max(130, Math.min(rect.width - 130, left));
  tip.classList.toggle('below', s.y * k < 230);
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
  tip.classList.add('show');
}
function deactivate(id) { const n = nodes[id]; [n.g, n.arc, n.flow, n.item].forEach(e => e && e.classList.remove('active')); }
function clear() { if (current) deactivate(current); current = null; svg.classList.remove('has-active', 'yisus'); tip.classList.remove('show'); }
function scheduleClear() { clearTimeout(clearT); clearT = setTimeout(clear, 260); }
tip.addEventListener('mouseenter', () => clearTimeout(clearT));
tip.addEventListener('mouseleave', scheduleClear);
document.addEventListener('click', e => { if (!tip.contains(e.target)) clear(); });

// Secuencia de entrada: mapa → Larry → líneas → puntos
const order = D.studios.slice().sort((a, b) => Math.hypot(a.x - H.x, a.y - H.y) - Math.hypot(b.x - H.x, b.y - H.y));
order.forEach((s, i) => {
  const n = nodes[s.id], t = 1300 + i * 140;
  setTimeout(() => n.arc.classList.add('go'), t);
  setTimeout(() => { n.g.classList.add('go'); n.flow.classList.add('go'); }, t + 900);
});
// Contador
const total = D.studios.length, cEl = document.getElementById('count');
let c = 0; const ci = setInterval(() => { cEl.textContent = ++c; if (c >= total) clearInterval(ci); }, 1400 / total);

// Cielo estrellado
const cv = document.getElementById('stars'), cx = cv.getContext('2d');
let stars = [];
function resize() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  stars = Array.from({ length: Math.round(innerWidth * innerHeight / 5200) }, () => ({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, r: Math.random() * 1.1 + .2, p: Math.random() * 6.28, s: Math.random() * .02 + .004 }));
}
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
function tick() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  for (const st of stars) { st.p += st.s; cx.globalAlpha = .25 + .55 * (.5 + .5 * Math.sin(st.p)); cx.fillStyle = '#fff'; cx.beginPath(); cx.arc(st.x, st.y, st.r, 0, 6.28); cx.fill(); }
  if (!still) requestAnimationFrame(tick);
}
addEventListener('resize', resize); resize(); tick();
</script>
</body>
</html>
