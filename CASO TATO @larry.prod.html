<style>
:root{
  color-scheme: dark;
  --red:#c4c4cd;
  --bg:#0a0a0b;
  --surface:#161618;
  --surface-2:#1d1d20;
  --line:#2a2a2e;
  --text:#f4f4f5;
  --muted:#9a9aa2;
  --muted-2:#6c6c74;
}
*{box-sizing:border-box;margin:0;padding:0;forced-color-adjust:none}
html,body{width:100%;min-height:100%;background:var(--bg);font-family:'Inter',system-ui,sans-serif;color:var(--text)}
body{
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:56px 16px 72px;
  position:relative;overflow-x:hidden;
}
.nebula{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;width:100%;max-width:760px;display:flex;flex-direction:column;align-items:center}
#main-logo{display:block;height:110px;width:auto;filter:drop-shadow(0 6px 26px rgba(0,0,0,.7))}
.eyebrow{
  margin-top:20px;
  font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);padding:6px 16px;border-radius:999px;
}

.hero{margin-top:34px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid var(--line);box-shadow:0 14px 30px -12px rgba(0,0,0,.9)}
h1{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(40px,9vw,64px);letter-spacing:1px;line-height:1;text-transform:uppercase}
h1 .accent{color:var(--red)}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.tag{
  font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--red);
  background:rgba(196,196,205,.12);border:1px solid rgba(196,196,205,.32);border-radius:999px;padding:4px 12px;
}
.ig{font-size:13px;color:var(--muted);text-decoration:none}
.ig:hover{color:var(--text)}
.quote{
  margin-top:28px;max-width:580px;
  font-size:17px;line-height:1.6;color:var(--text);
  border-left:2px solid var(--red);padding-left:18px;text-align:left;
}

.section{width:100%;margin-top:52px}
.section-label{
  font-family:'Anton',sans-serif;font-size:18px;letter-spacing:1.2px;text-transform:uppercase;color:var(--red);
  margin-bottom:18px;padding-bottom:10px;border-bottom:1px dashed var(--line);
}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:26px;box-shadow:0 14px 30px -18px rgba(0,0,0,.8);
}

/* A/B */
.ab-switch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ab-btn{
  font-family:inherit;cursor:pointer;
  background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
  padding:16px 12px;color:var(--muted);text-align:center;transition:.15s ease;
}
.ab-btn strong{display:block;font-family:'Anton',sans-serif;font-weight:400;font-size:24px;letter-spacing:1px;text-transform:uppercase}
.ab-btn span{display:block;margin-top:4px;font-size:11px;letter-spacing:.4px}
.ab-btn:hover{color:var(--text);border-color:var(--muted-2)}
.ab-btn[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--bg)}
.player{display:flex;align-items:center;gap:16px;margin-top:22px}
.play{
  flex:0 0 auto;width:58px;height:58px;border-radius:50%;cursor:pointer;
  background:var(--text);border:0;color:var(--bg);display:grid;place-items:center;
  transition:transform .12s ease;
}
.play:hover{transform:scale(1.05)}
.play svg{width:22px;height:22px}
.track{flex:1;min-width:0}
.bar{position:relative;height:8px;border-radius:999px;background:var(--line);cursor:pointer;touch-action:none}
.bar-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:var(--red)}
.bar-knob{position:absolute;top:50%;left:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--text)}
.times{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--muted-2);font-variant-numeric:tabular-nums}
.now{margin-top:18px;font-size:13px;color:var(--muted);text-align:center}
.now b{color:var(--text)}
.hint{margin-top:16px;font-size:12px;color:var(--muted-2);text-align:center;line-height:1.5}

/* Portadas */
.compare{display:flex;align-items:center;gap:14px}
.compare-item{flex:1;min-width:0}
.compare-item img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:14px;border:1px solid var(--line);display:block}
.compare-item img.bw{filter:grayscale(1)}
.compare-label{margin-top:10px;text-align:center;font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.compare-arrow{flex:0 0 auto;font-size:22px;color:var(--red)}

.foot{position:relative;z-index:1;margin-top:64px;font-size:11px;letter-spacing:2px;color:var(--muted-2);text-align:center}

@media (max-width:520px){
  .card{padding:18px}
  .quote{font-size:15px}
  .compare{gap:8px}
}

.vid{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:9/16;background:#000;border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:0 14px 30px -18px rgba(0,0,0,.9)}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ig-embed{width:100%;max-width:400px;margin:0 auto;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#fff}
.ig-embed iframe{display:block;width:100%;height:720px;border:0}
.covers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.covers.one{grid-template-columns:minmax(0,280px);justify-content:center}
.covers figure{margin:0}
.covers img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;border:1px solid var(--line);display:block}
.covers figcaption{margin-top:8px;text-align:center;font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
@media (max-width:520px){.covers{gap:8px}.ig-embed iframe{height:620px}}
</style>
</head>
